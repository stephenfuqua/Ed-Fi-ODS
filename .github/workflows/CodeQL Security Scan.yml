name: CodeQL Security Scan Schedule

on:
  schedule:
    - cron: "0 0 * * *"

permissions: read-all

env:
  INFORMATIONAL_VERSION: "7.3"
  BUILD_INCREMENTER: "-1486"
  CONFIGURATION: "Release"
  HEAD_REF: ${{ GITHUB.HEAD_REF }}
  REF_NAME: ${{ GITHUB.REF_NAME }}
  REPOSITORY_DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}

jobs:
  FindStandardAndExtensionVersions:
    uses: ./.github/workflows/Find Standard and Extension Versions.yml

  analyze:
    if: ${{ always() }}
    needs: FindStandardAndExtensionVersions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        StandardVersion: ${{ fromJson(needs.FindStandardAndExtensionVersions.outputs.StandardVersions) }}
        ExtensionVersion: ${{ fromJson(needs.FindStandardAndExtensionVersions.outputs.ExtensionVersions) }}
    name: Analyze Code (Standard ${{ matrix.StandardVersion }} Extension ${{ matrix.ExtensionVersion }})
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0d579ffd059c29b07949a3cce3983f0780820c98 # 4.32.6
        with:
          languages: csharp

      - name: CodeGen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable
          ./Initialize-PowershellForDevelopment.ps1
          Invoke-CodeGen -Engine PostgreSQL `
            -RepositoryRoot $env:GITHUB_WORKSPACE/ `
            -StandardVersion ${{ matrix.StandardVersion }} `
            -ExtensionVersion ${{ matrix.ExtensionVersion }}

      - name: Cache Nuget packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # 5.0.3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*', '**/configuration.packages.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        run: |
          .\build.githubactions.ps1 restore -Solution "./Application/Ed-Fi-Ods.sln"
        shell: pwsh

      - name: build
        shell: pwsh
        run: |
          .\build.githubactions.ps1 build `
            -NoRestore
            -Configuration ${{ env.CONFIGURATION }} `
            -InformationalVersion ${{ env.INFORMATIONAL_VERSION}} `
            -BuildCounter ${{ github.run_number }} `
            -BuildIncrementer ${{env.BUILD_INCREMENTER}} `
            -Solution "./Application/Ed-Fi-Ods.sln"
            -StandardVersion ${{ matrix.StandardVersion }} `
            -Owner ${{ github.repository_owner }} `
            -Repository ${{ github.repository }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98 # 4.32.6
